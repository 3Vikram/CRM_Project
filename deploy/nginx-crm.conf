server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    root /var/www/crm;
    index index.html;

    location /api/inventory {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/assets {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/products {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/daily-email {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/delivery-challans {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/returned-challans {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/accessories {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /api/suppliers/inventory-options {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5001;
    }

    location /api/customers/inventory-options {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5001;
    }

    location /uploads/products/ {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /uploads/documents/ {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5000;
    }

    location /uploads {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5001;
    }

    location /api {
        include snippets/crm-proxy.conf;
        proxy_pass http://127.0.0.1:5001;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
